name: CI

# Build check only. The site itself is deployed by Cloudflare, which publishes
# production only from main. Protect main (require PR + approval + this check)
# so nothing reaches production without owner approval.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
